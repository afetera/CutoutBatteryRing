plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.eta.cutoutring'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.eta.cutoutring"
        minSdk 29
        targetSdk 34
        versionCode 22
        versionName "1.21"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 只在编译期使用，不打包进 APK（由 LSPosed 在运行时提供实现）
    compileOnly 'de.robv.android.xposed:api:82'
}
